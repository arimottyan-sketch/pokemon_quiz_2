name: Official Pokedex collection (v3)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/collect-pokedex.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect official entries
        shell: bash
        run: |
          python collect_official.py --delay 0.5 --retries 2 || code=$?
          if [ "${code:-0}" -ne 0 ] && [ "${code:-0}" -ne 2 ]; then exit "$code"; fi
      - name: Check application tests
        run: python -m unittest discover -s tests -v
      - name: Commit verified data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pokedex.json data/collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update collected official Pokedex text'
            git push
          fi
      - name: Show results
        run: python -c 'import json; s=json.load(open("data/collection_status.json", encoding="utf-8")); print("Collected:", s["fetched_from_official_count"], "/", s["all_target_count"]); print("Missing IDs:", s["missing_ids"])'
