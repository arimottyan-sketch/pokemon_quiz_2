name: 公式図鑑の収集と固定保存
on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: "すでに取得したデータも再取得する"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: コード取得
        uses: actions/checkout@v4
      - name: Python準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 必要なライブラリ
        run: pip install -r requirements.txt
      - name: 公式の原文を取得（失敗箇所も保存）
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.refresh_all }}" = "true" ]; then EXTRA="--refresh-all"; fi
          python collect_official.py --delay 0.5 --retries 2 $EXTRA
      - name: 正当性チェック
        run: python -m unittest discover -s tests -v
      - name: 更新したデータをGitHubへ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pokedex.json data/collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 公式図鑑から原文を収集"
            git push
          fi
      - name: 収集数の表示
        run: python -c 'import json; s=json.load(open("data/collection_status.json")); print(f"取得完了: {s[\"fetched_from_official_count\"]}/{s[\"all_target_count\"]}; 未取得: {s[\"missing_ids\"]}")'
