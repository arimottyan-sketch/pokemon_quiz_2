name: Collect official Pokedex data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect official Pokedex text
        shell: bash
        run: |
          set +e
          python collect_official.py --delay 0.5 --retries 2
          result=$?
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Test project
        run: python -m unittest discover -s tests -v
      - name: Save collected data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pokedex.json data/collection_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified Pokedex data'
            git push
          fi
      - name: Check collection completeness
        run: |
          python -c 'import json; s=json.load(open("data/collection_status.json",encoding="utf-8")); print("Collected:",s["fetched_from_official_count"],"/",s["all_target_count"]); print("Missing:",s["missing_ids"]); raise SystemExit(bool(s["missing_ids"]))'
